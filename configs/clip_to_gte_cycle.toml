[general]
seed = 1
sampling_seed = 5
train_dataset_seed = 10
val_dataset_seed = 42
normalize_embeddings = true
mixed_precision = "bf16"
weight_init = "kaiming"
max_seq_length = 64
unsup_emb = "clip"
sup_emb = "gte"

[dataset]
dataset = "cycle"  # Use CyclePrefDB-T2I dataset
streaming = false  # Cycle dataset doesn't support streaming
distribution_split = false  # Cycle dataset doesn't support distribution split
cycle_mode = "image_to_reconstruction"  # Translate images -> text reconstructions
cycle_sample_strategy = "random"  # Random sampling from generations
cycle_image_size = 224  # CLIP ViT-B/32 input size
n_embs_per_batch = 1

[model]
finetune_mode = false
noise_level = 0.0
style = "res_mlp"
norm_style = "batch"
depth = 3
transform_depth = 4
d_adapter = 1024
d_hidden = 1024
d_transform = 1024
use_small_output_adapters = false
use_residual_adapters = true
gan_style = "least_squares"
disc_depth = 4
disc_dim = 1024
use_residual = true
bs = 256
gradient_accumulation_steps = 1
lr = 5e-5
no_scheduler = true
max_grad_norm = 1000.0
loss_coefficient_reverse_rec = 0.0
loss_coefficient_rec = 1.0
loss_coefficient_vsp = 1.0
loss_coefficient_cc_trans = 10.0
loss_coefficient_cc_rec = 0.0
loss_coefficient_cc_vsp = 10.0
loss_coefficient_r1_penalty = 0.0
warmup_length = 2000
# patience = 5
# min_delta = 0.0
min_epochs = 10
disc_lr = 2e-5
eps = 6.25e-10
smooth = 0.9
loss_coefficient_disc = 5.0
loss_coefficient_gen = 1.0
loss_coefficient_latent_gen = 5.0
loss_coefficient_similarity_gen = 0.0

[run]
val_size = 4096
val_bs = 1024
top_k_size = 1024
top_k_batches = 4
k = 16
heatmap_size = 64
use_wandb = true
wandb_project = "unsupervised_grid_7"
wandb_name = "m:bf16,n:1000000,e:100,u:clip,s:gte,s:1,l:5.0,l:5.0,t:4,d:4,l:5e-05,d:2e-05"
load_dir = "./finetuning_unsupervised/n:100000,e:10,s:n_double,d:4,d:4,d:64/"
save_dir = "./finetuning_unsupervised/{}/"
force_dump = true
num_points = 1000000
epochs = 10000
num_params = 20480256
num_disc_params = 2629633
num_sup_disc_params = 2891777
num_latent_disc_params = 3153921
num_similarity_disc_params = 2367489